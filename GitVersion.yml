workflow: GitHubFlow/v1
mode: ContinuousDelivery
next-version: 0.1.0
commit-message-incrementing: Enabled
major-version-bump-message: '(?i)(BREAKING CHANGE|^[a-z]+(?:\([^)]+\))?!:)'
minor-version-bump-message: '(?i)^feat(?:\([^)]+\))?:'
patch-version-bump-message: '(?i)^(fix|perf)(?:\([^)]+\))?:'
no-bump-message: '(?i)^(docs|style|test|build|ci|chore|refactor)(?:\([^)]+\))?:'
