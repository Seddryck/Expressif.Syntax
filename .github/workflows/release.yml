name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve validated CI packages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ci-run-id: ${{ steps.ci-run.outputs.run-id }}
      patch: ${{ steps.gitversion.outputs.patch }}
      sha: ${{ steps.release-context.outputs.sha }}
      version: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - name: Resolve release commit
        id: release-context
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_SHA)) {
            throw 'Could not resolve the release commit.'
          }
          "sha=$env:GITHUB_SHA" >> $env:GITHUB_OUTPUT

      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.release-context.outputs.sha }}

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - name: Calculate release version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          useConfigFile: true

      - name: Locate successful CI run for release commit
        id: ci-run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release-context.outputs.sha }}
        shell: pwsh
        run: |
          $run = $null
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            $response = gh api `
              "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" `
              --method GET `
              -f head_sha="$env:RELEASE_SHA" `
              -f per_page=100 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not query CI workflow runs.' }

            $runs = @($response.workflow_runs | Where-Object {
              $_.head_sha -eq $env:RELEASE_SHA
            } | Sort-Object run_attempt, id -Descending)
            $run = $runs | Where-Object conclusion -eq 'success' | Select-Object -First 1
            if ($null -ne $run) { break }

            $activeRun = $runs | Where-Object status -ne 'completed' | Select-Object -First 1
            $completedRun = $runs | Where-Object status -eq 'completed' | Select-Object -First 1
            if ($null -eq $activeRun -and $null -ne $completedRun) {
              throw "CI run '$($completedRun.id)' for '$env:RELEASE_SHA' concluded '$($completedRun.conclusion)'."
            }

            if ($attempt -lt 60) {
              Write-Output "Waiting for CI to validate '$env:RELEASE_SHA' (attempt $attempt of 60)."
              Start-Sleep -Seconds 30
            }
          }

          if ($null -eq $run) {
            throw "No successful CI run exists for release commit '$env:RELEASE_SHA'."
          }

          "run-id=$($run.id)" >> $env:GITHUB_OUTPUT
          Write-Output "Using successful CI run '$($run.id)' for '$env:RELEASE_SHA'."

  publish:
    name: Publish patch-zero release
    if: needs.validate.outputs.patch == '0'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Check out publication guard
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.sha }}

      # Every registry or release publication step must remain below this guard.
      - name: Enforce main-only publication
        shell: pwsh
        run: ./scripts/Assert-MainPublication.ps1

      - name: Download validated release packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.validate.outputs.version }}
          path: artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}

      - name: Create tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $existingTag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" `
            --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingTag -ne $env:RELEASE_SHA) {
              throw "Tag '$tag' already points to '$existingTag', not '$env:RELEASE_SHA'."
            }
            gh release view $tag | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Tag '$tag' exists for this commit but its GitHub release is missing."
            }
            Write-Output "Release '$tag' already exists for this commit; leaving its artifacts unchanged."
            exit 0
          }

          gh release create $tag artifacts/* `
            --target $env:RELEASE_SHA `
            --title $tag `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub release '$tag' creation failed." }

      - name: Log in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Seddryck

      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet trusted publishing did not provide a temporary API key.'
          }
          $packages = @(Get-ChildItem -LiteralPath artifacts -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package, found $($packages.Count)."
          }
          dotnet nuget push $packages[0].FullName `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
