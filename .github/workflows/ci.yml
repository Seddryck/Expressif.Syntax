name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Calculate package version
    runs-on: ubuntu-latest
    outputs:
      patch: ${{ steps.gitversion.outputs.patch }}
      semver: ${{ steps.gitversion.outputs.semVer }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: 6.x

      - name: Calculate repository version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4
        with:
          useConfigFile: true

  parser:
    name: Test Tree-sitter parser
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Test parser
        uses: tree-sitter/parser-test-action@v3

  native:
    name: Build native library (${{ matrix.rid }})
    needs: parser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            library: tree-sitter-expressif.dll
          - os: windows-11-arm
            rid: win-arm64
            library: tree-sitter-expressif.dll
          - os: ubuntu-latest
            rid: linux-x64
            library: libtree-sitter-expressif.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            library: libtree-sitter-expressif.so
          - os: macos-15-intel
            rid: osx-x64
            library: libtree-sitter-expressif.dylib
          - os: macos-15
            rid: osx-arm64
            library: libtree-sitter-expressif.dylib

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Tree-sitter
        uses: tree-sitter/setup-action/cli@v2

      - name: Build native grammar library
        shell: pwsh
        run: |
          $outputDirectory = Join-Path 'native-assets' '${{ matrix.rid }}'
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          tree-sitter build -o (Join-Path $outputDirectory '${{ matrix.library }}') .
          if ($LASTEXITCODE -ne 0) { throw 'Native grammar build failed.' }

      - name: Upload native grammar library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: native-assets/${{ matrix.rid }}/${{ matrix.library }}
          if-no-files-found: error

  package:
    name: Build C# package
    needs: [version, native]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Windows native grammar library
        uses: actions/download-artifact@v8
        with:
          name: native-win-x64
          path: native-assets/win-x64

      - name: Download Linux native grammar library
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: native-assets/linux-x64

      - name: Download Windows ARM64 native grammar library
        uses: actions/download-artifact@v8
        with:
          name: native-win-arm64
          path: native-assets/win-arm64

      - name: Download Linux ARM64 native grammar library
        uses: actions/download-artifact@v8
        with:
          name: native-linux-arm64
          path: native-assets/linux-arm64

      - name: Download macOS x64 native grammar library
        uses: actions/download-artifact@v8
        with:
          name: native-osx-x64
          path: native-assets/osx-x64

      - name: Download macOS ARM64 native grammar library
        uses: actions/download-artifact@v8
        with:
          name: native-osx-arm64
          path: native-assets/osx-arm64

      - name: Build NuGet package
        shell: pwsh
        run: >-
          ./scripts/Build-NuGetPackage.ps1
          -Version '${{ needs.version.outputs.semver }}'
          -NativeAssetsDirectory 'native-assets'

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ needs.version.outputs.semver }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  consume:
    name: Test C# package (${{ matrix.rid }})
    needs: [version, package]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
          - os: macos-15
            rid: osx-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET runtimes
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download NuGet package
        uses: actions/download-artifact@v8
        with:
          name: nuget-${{ needs.version.outputs.semver }}
          path: artifacts

      - name: Restore installed package tests
        shell: pwsh
        run: |
          $packageSource = (Resolve-Path 'artifacts').Path
          dotnet restore bindings/csharp/Expressif.Syntax.Tests/Expressif.Syntax.Tests.csproj `
            -p:RestoreAdditionalProjectSources=$packageSource `
            -p:PackageVersionUnderTest='${{ needs.version.outputs.semver }}'
          if ($LASTEXITCODE -ne 0) { throw 'Package test restore failed.' }

      - name: Test installed package
        shell: pwsh
        run: >-
          dotnet test bindings/csharp/Expressif.Syntax.Tests/Expressif.Syntax.Tests.csproj
          --configuration Release
          --no-restore
          -p:PackageVersionUnderTest='${{ needs.version.outputs.semver }}'

  native-archive:
    name: Build native C archive
    needs: [version, parser]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build native C archive
        shell: pwsh
        run: ./scripts/New-NativeArchive.ps1 -Version '${{ needs.version.outputs.semver }}'

      - name: Upload native C archive
        uses: actions/upload-artifact@v7
        with:
          name: native-source-${{ needs.version.outputs.semver }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

  collect:
    name: Collect validated packages
    needs: [version, consume, native-archive]
    runs-on: ubuntu-latest

    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v8
        with:
          pattern: '*-${{ needs.version.outputs.semver }}'
          path: artifacts
          merge-multiple: true

      - name: Upload package validation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ needs.version.outputs.semver }}
          path: artifacts/*
          if-no-files-found: error

  gate:
    name: CI gate
    if: always()
    needs: [version, parser, native, package, consume, native-archive, collect]
    runs-on: ubuntu-latest

    steps:
      - name: Require every validation job to succeed
        shell: pwsh
        run: |
          $results = @{
            version = '${{ needs.version.result }}'
            parser = '${{ needs.parser.result }}'
            native = '${{ needs.native.result }}'
            package = '${{ needs.package.result }}'
            consume = '${{ needs.consume.result }}'
            nativeArchive = '${{ needs.native-archive.result }}'
            collect = '${{ needs.collect.result }}'
          }
          $failed = @($results.GetEnumerator() | Where-Object Value -ne 'success')
          if ($failed.Count -gt 0) {
            $failed | ForEach-Object { Write-Error "$($_.Key) finished with result '$($_.Value)'." }
            exit 1
          }
          Write-Output 'All required CI validations succeeded.'

  publish:
    name: Publish patch-zero release
    if: github.ref == 'refs/heads/main' && needs.version.outputs.patch == '0'
    needs: [version, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out publication guard
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      # Every registry or release publication step must remain below this guard.
      - name: Enforce main-only publication
        shell: pwsh
        run: ./scripts/Assert-MainPublication.ps1

      - name: Download validated release packages
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ needs.version.outputs.semver }}
          path: artifacts

      - name: Create tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.semver }}
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $existingTag = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" `
            --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingTag -ne $env:RELEASE_SHA) {
              throw "Tag '$tag' already points to '$existingTag', not '$env:RELEASE_SHA'."
            }
            gh release view $tag | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "Tag '$tag' exists for this commit but its GitHub release is missing."
            }
            Write-Output "Release '$tag' already exists for this commit; leaving its artifacts unchanged."
            exit 0
          }

          gh release create $tag artifacts/* `
            --target $env:RELEASE_SHA `
            --title $tag `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub release '$tag' creation failed." }

      - name: Log in to NuGet with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: Seddryck

      - name: Publish NuGet package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'NuGet trusted publishing did not provide a temporary API key.'
          }
          $packages = @(Get-ChildItem -LiteralPath artifacts -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package, found $($packages.Count)."
          }
          dotnet nuget push $packages[0].FullName `
            --api-key $env:NUGET_API_KEY `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'NuGet publication failed.' }
